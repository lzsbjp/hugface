<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>贪吃蛇小游戏</title>
  <style>
    :root {
      --bg: #0f1226;
      --panel: #171a33;
      --text: #e9ecff;
      --accent: #7aa2f7;
      --accent-2: #9ece6a;
      --danger: #f7768e;
      --grid: #2a2f4a;
      --snake: #a3be8c;
      --food: #eb6f92;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: radial-gradient(1200px 600px at 70% 10%, #141736 0%, var(--bg) 55%) fixed;
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial;
    }
    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 24px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .title {
      font-weight: 700;
      letter-spacing: 0.2px;
      font-size: 18px;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    .title small {
      font-weight: 500;
      color: #b7bdf8;
    }
    .panel {
      background: linear-gradient(180deg, #11142b 0%, var(--panel) 100%);
      border: 1px solid #21264a;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
      padding: 14px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat {
      border: 1px solid #22264a;
      background: #131634;
      border-radius: 10px;
      padding: 10px 12px;
    }
    .label { color: #9aa0c6; font-size: 12px; }
    .value { font-weight: 700; font-size: 18px; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    button {
      appearance: none;
      border: 1px solid #2b3158;
      background: #1b1f3f;
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .05s ease, background .2s ease, border-color .2s ease;
    }
    button:hover { background: #242a56; }
    button:active { transform: translateY(1px); }
    button.primary {
      background: #25305f;
      border-color: #3b4fa4;
      color: #eaf0ff;
    }
    .hint {
      color: #aab1da;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .game {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
    }
    .board-wrap {
      position: relative;
      aspect-ratio: 1 / 1;
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.15)),
        repeating-linear-gradient(0deg, var(--grid) 0px, var(--grid) 1px, transparent 1px, transparent 32px),
        repeating-linear-gradient(90deg, var(--grid) 0px, var(--grid) 1px, transparent 1px, transparent 32px),
        #0d1026;
      border: 1px solid #2a2f4a;
    }
    canvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      display: block;
    }

    .side {
      min-width: 240px;
      max-width: 280px;
    }
    .kbd {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 10px;
    }
    .key {
      border: 1px dashed #3b3f64;
      background: #14183a;
      color: #cdd4ff;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      font-size: 12px;
    }
    .mobile-pad {
      display: grid;
      grid-template-columns: repeat(3, 64px);
      grid-template-rows: repeat(3, 64px);
      gap: 8px;
      justify-content: center;
      margin-top: 16px;
      touch-action: manipulation;
    }
    .pad-btn {
      border: 1px solid #2b3158;
      background: #1b1f3f;
      color: var(--text);
      border-radius: 12px;
      font-weight: 700;
      display: grid;
      place-items: center;
      user-select: none;
    }
    .pad-btn:active { background: #2a3162; }
    .pad-empty { background: transparent; border: none; }

    footer {
      margin-top: 18px;
      color: #8f96c9;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 760px) {
      .game { grid-template-columns: 1fr; }
      .side { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">
        <span>贪吃蛇小游戏</span>
        <small>方向键 / WASD 控制，空格暂停</small>
      </div>
      <div class="controls">
        <button id="btn-start" class="primary">开始/继续</button>
        <button id="btn-pause">暂停</button>
        <button id="btn-restart">重新开始</button>
        <button id="btn-speed">速度 x1</button>
      </div>
    </header>

    <div class="panel">
      <div class="stats">
        <div class="stat">
          <div class="label">分数</div>
          <div class="value" id="score">0</div>
        </div>
        <div class="stat">
          <div class="label">长度</div>
          <div class="value" id="length">1</div>
        </div>
        <div class="stat">
          <div class="label">最佳</div>
          <div class="value" id="best">0</div>
        </div>
        <div class="stat">
          <div class="label">状态</div>
          <div class="value" id="status">准备</div>
        </div>
      </div>

      <div class="game">
        <div class="board-wrap">
          <canvas id="board" width="480" height="480" aria-label="游戏画布"></canvas>
        </div>

        <div class="side">
          <div class="hint">吃到食物增加分数与长度。撞墙或撞到自己则游戏结束。</div>
          <div class="kbd">
            <div class="key">W / ↑</div>
            <div class="key">空格</div>
            <div class="key">D / →</div>
            <div class="key">A / ←</div>
            <div class="key">开始/暂停</div>
            <div class="key">S / ↓</div>
          </div>

          <div class="mobile-pad" aria-label="移动端方向键">
            <div class="pad-empty"></div>
            <div class="pad-btn" data-dir="up">↑</div>
            <div class="pad-empty"></div>
            <div class="pad-btn" data-dir="left">←</div>
            <div class="pad-empty"></div>
            <div class="pad-btn" data-dir="right">→</div>
            <div class="pad-empty"></div>
            <div class="pad-btn" data-dir="down">↓</div>
            <div class="pad-empty"></div>
          </div>
        </div>
      </div>
    </div>

    <footer>
      提示：点击“速度”切换 x1/x1.5/x2。支持键盘和屏幕按键操作。
    </footer>
  </div>

  <script>
    // 游戏配置
    const CELL = 24;              // 单元格像素
    const GRID = 20;              // 网格大小 (GRID x GRID)
    const BASE_TICK = 120;        // 基础帧间隔(ms)

    // 画布与上下文
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');

    // UI元素
    const elScore = document.getElementById('score');
    const elLength = document.getElementById('length');
    const elBest = document.getElementById('best');
    const elStatus = document.getElementById('status');
    const btnStart = document.getElementById('btn-start');
    const btnPause = document.getElementById('btn-pause');
    const btnRestart = document.getElementById('btn-restart');
    const btnSpeed = document.getElementById('btn-speed');

    // 状态
    let snake, dir, nextDir, food, running, timer, score, speedMul, best;
    let wrapWalls = false; // 可改为 true 体验穿墙

    function reset() {
      snake = [{ x: Math.floor(GRID/2), y: Math.floor(GRID/2) }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      speedMul = 1;
      placeFood();
      updateStats();
      draw();
      setStatus('准备');
    }

    function setStatus(t) { elStatus.textContent = t; }
    function updateStats() {
      elScore.textContent = score;
      elLength.textContent = snake.length;
      if (best == null) {
        best = Number(localStorage.getItem('snake.best') || 0);
      }
      elBest.textContent = best;
    }

    function placeFood() {
      const taken = new Set(snake.map(p => p.x + ',' + p.y));
      let fx, fy;
      do {
        fx = Math.floor(Math.random() * GRID);
        fy = Math.floor(Math.random() * GRID);
      } while (taken.has(fx + ',' + fy));
      food = { x: fx, y: fy };
    }

    function drawCell(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    }

    function draw() {
      // 背景清理
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 轻微网格阴影（已在CSS背景中，保留清屏）
      // 绘制食物
      drawCell(food.x, food.y, '#eb6f92');
      ctx.fillStyle = 'rgba(235,111,146,0.35)';
      ctx.fillRect(food.x * CELL + 4, food.y * CELL + 4, CELL - 8, CELL - 8);

      // 绘制蛇
      for (let i = snake.length - 1; i >= 0; i--) {
        const p = snake[i];
        const isHead = i === 0;
        const color = isHead ? '#a6da95' : '#a3be8c';
        drawCell(p.x, p.y, color);
        if (isHead) {
          // 头部高光
          ctx.fillStyle = 'rgba(255,255,255,0.20)';
          ctx.fillRect(p.x * CELL + 3, p.y * CELL + 3, CELL - 6, CELL - 6);
        }
      }
    }

    function tick() {
      // 方向更新（防止同帧多次改变）
      dir = nextDir;

      // 新头部位置
      let nx = snake[0].x + dir.x;
      let ny = snake[0].y + dir.y;

      // 边界处理
      if (wrapWalls) {
        nx = (nx + GRID) % GRID;
        ny = (ny + GRID) % GRID;
      } else {
        if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID) {
          return gameOver();
        }
      }

      // 碰到自己
      for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === nx && snake[i].y === ny) {
          return gameOver();
        }
      }

      // 移动
      snake.unshift({ x: nx, y: ny });

      // 吃到食物
      if (nx === food.x && ny === food.y) {
        score += 10;
        if (score > (best ?? 0)) {
          best = score;
          localStorage.setItem('snake.best', String(best));
        }
        placeFood();
      } else {
        snake.pop();
      }

      updateStats();
      draw();
    }

    function start() {
      if (running) return;
      setStatus('进行中');
      const interval = BASE_TICK / speedMul;
      timer = setInterval(tick, interval);
      running = true;
    }

    function pause() {
      if (!running) return;
      clearInterval(timer);
      running = false;
      setStatus('暂停');
    }

    function restart() {
      clearInterval(timer);
      running = false;
      reset();
    }

    function gameOver() {
      clearInterval(timer);
      running = false;
      setStatus('结束');
      draw();
      // 简单闪烁效果提示
      flashBoard();
    }

    function flashBoard(times = 2) {
      let count = 0;
      const id = setInterval(() => {
        canvas.style.filter = (canvas.style.filter ? '' : 'brightness(0.6) saturate(1.4)');
        if (++count >= times * 2) {
          clearInterval(id);
          canvas.style.filter = '';
        }
      }, 120);
    }

    function setDir(nx, ny) {
      // 防止直接反向
      if (snake.length > 1 && nx === -dir.x && ny === -dir.y) return;
      nextDir = { x: nx, y: ny };
    }

    // 事件绑定：键盘
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'arrowup' || k === 'w') setDir(0, -1);
      else if (k === 'arrowdown' || k === 's') setDir(0, 1);
      else if (k === 'arrowleft' || k === 'a') setDir(-1, 0);
      else if (k === 'arrowright' || k === 'd') setDir(1, 0);
      else if (k === ' ') {
        if (running) pause(); else start();
      }
    });

    // 事件绑定：按钮
    btnStart.addEventListener('click', () => start());
    btnPause.addEventListener('click', () => pause());
    btnRestart.addEventListener('click', () => restart());
    btnSpeed.addEventListener('click', () => {
      const steps = [1, 1.5, 2];
      const next = steps[(steps.indexOf(speedMul) + 1) % steps.length];
      speedMul = next;
      btnSpeed.textContent = `速度 x${next}`;
      if (running) {
        clearInterval(timer);
        timer = setInterval(tick, BASE_TICK / speedMul);
      }
    });

    // 事件绑定：触屏方向键
    document.querySelectorAll('.pad-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const d = btn.getAttribute('data-dir');
        if (d === 'up') setDir(0, -1);
        else if (d === 'down') setDir(0, 1);
        else if (d === 'left') setDir(-1, 0);
        else if (d === 'right') setDir(1, 0);
        if (!running) start();
      });
    });

    // 自适应画布大小（保持正方形且贴合容器）
    function fitCanvas() {
      const wrap = document.querySelector('.board-wrap');
      const size = Math.min(wrap.clientWidth, wrap.clientHeight);
      const px = Math.floor(size / GRID) * GRID; // 贴合网格
      canvas.width = px;
      canvas.height = px;
      // 重绘
      draw();
    }
    window.addEventListener('resize', fitCanvas);

    // 初始化
    reset();
    fitCanvas();
  </script>
</body>
</html>
